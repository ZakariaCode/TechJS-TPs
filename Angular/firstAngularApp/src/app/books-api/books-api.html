<div class="container">
  <h1>Book Management</h1>

  <!-- Create Button -->
  <div class="actions" *ngIf="!showForm">
    <button class="btn btn-primary" (click)="showCreateForm()">
      Add New Book
    </button>
  </div>

  <!-- Book Form (Create/Edit) -->
  <div class="book-form" *ngIf="showForm">
    <h2>{{ isEditMode ? 'Edit Book' : 'Create New Book' }}</h2>
    <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Title:</label>
        <input 
          type="text" 
          id="title" 
          formControlName="title" 
          class="form-control"
          [class.invalid]="bookForm.get('title')?.invalid && bookForm.get('title')?.touched">
        <div class="error" *ngIf="bookForm.get('title')?.invalid && bookForm.get('title')?.touched">
          Title is required
        </div>
      </div>

      <div class="form-group">
        <label for="author">Author:</label>
        <input 
          type="text" 
          id="author" 
          formControlName="author" 
          class="form-control"
          [class.invalid]="bookForm.get('author')?.invalid && bookForm.get('author')?.touched">
        <div class="error" *ngIf="bookForm.get('author')?.invalid && bookForm.get('author')?.touched">
          Author is required
        </div>
      </div>

      <div class="form-group">
        <label for="year">Year:</label>
        <input 
          type="number" 
          id="year" 
          formControlName="year" 
          class="form-control"
          [class.invalid]="bookForm.get('year')?.invalid && bookForm.get('year')?.touched">
        <div class="error" *ngIf="bookForm.get('year')?.invalid && bookForm.get('year')?.touched">
          Year must be between 1900 and 2100
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-success" [disabled]="bookForm.invalid">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancelForm()">
          Cancel
        </button>
      </div>
    </form>
  </div>

  <!-- Books List -->
  <div class="books-list" *ngIf="!showForm">
    <h2>Books List</h2>
    <div class="book-card" *ngFor="let book of books">
      <div class="book-info">
        <h3>{{ book.title }}</h3>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p><strong>Year:</strong> {{ book.year }}</p>
      </div>
      <div class="book-actions">
        <button class="btn btn-edit" (click)="editBook(book.id!)">Edit</button>
        <button class="btn btn-delete" (click)="deleteBook(book.id!)">Delete</button>
      </div>
    </div>

    <div class="empty-state" *ngIf="books.length === 0">
      <p>No books available. Create one!</p>
    </div>
  </div>
</div>
